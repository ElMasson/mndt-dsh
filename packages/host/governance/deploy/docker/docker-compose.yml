# Governance stack: the authority plus its SSO front, announced to the existing
# Traefik by labels. Nothing in the Tellus compose project is modified: this
# project joins the Tellus network as an external network and is removed as a
# whole for a rollback.
name: governance

services:
  authority:
    image: node:20-alpine
    # cap_drop removes CAP_DAC_OVERRIDE, so the container must run as the account
    # that owns the state directory. The installer writes these into .env.
    user: "${GOV_UID:-0}:${GOV_GID:-0}"
    command: ["node", "/app/governance-authority.mjs"]
    # No secrets here: the authority authenticates bearers, it does not mint them.
    environment:
      DSH_GOVERNANCE_HOST: 0.0.0.0
      DSH_GOVERNANCE_PORT: "8787"
      DSH_GOVERNANCE_TOKENS_FILE: /etc/dsh/tokens.json
      DSH_GOVERNANCE_STATE: /var/lib/dsh/governance/rbac.json
      DSH_GOVERNANCE_AUDIT: /var/lib/dsh/governance/audit.jsonl
      # The authority is reachable only through the SSO front on this network, so
      # the email that front proved is the identity. `x-forwarded-email` is what
      # oauth2-proxy's pass_user_headers sends upstream (the X-Auth-Request-*
      # family is for auth_request setups). Never set this when the authority is
      # exposed directly.
      DSH_GOVERNANCE_PROXY_USER_HEADER: x-forwarded-email
    volumes:
      - /opt/dsh-governance/governance-authority.mjs:/app/governance-authority.mjs:ro
      - /etc/dsh/tokens.json:/etc/dsh/tokens.json:ro
      - /var/lib/dsh/governance:/var/lib/dsh/governance
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels:
      traefik.enable: "true"
      traefik.docker.network: "tellus-ai_default"
      # A workstation presents a bearer token and is answered by the authority
      # itself; the browser, which presents only a cookie, goes to oauth2-proxy.
      # The higher priority makes this router win for token calls.
      traefik.http.routers.governance-token.rule: "Host(`governance.duke-analytics.com`) && HeaderRegexp(`Authorization`, `(?i)^Bearer .+`)"
      traefik.http.routers.governance-token.entrypoints: "websecure"
      traefik.http.routers.governance-token.tls.certresolver: "letsencrypt"
      traefik.http.routers.governance-token.priority: "200"
      traefik.http.routers.governance-token.service: "governance-token"
      traefik.http.services.governance-token.loadbalancer.server.port: "8787"
    networks:
      - internal
      - tellus
    restart: unless-stopped

  oauth2proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5
    # The two secrets come from flags: this version does not resolve "@file" for
    # them. trusted-proxy-ip is also a flag, not a config key.
    command:
      - "--config=/etc/oauth2-proxy/governance.cfg"
      - "--client-secret-file=/etc/oauth2-proxy/client_secret"
      - "--cookie-secret-file=/etc/oauth2-proxy/cookie_secret"
      - "--trusted-proxy-ip=172.18.0.0/16"
    volumes:
      # One mount only: the configuration and both secrets live in this directory.
      - /etc/oauth2-proxy:/etc/oauth2-proxy:ro
    labels:
      traefik.enable: "true"
      traefik.docker.network: "tellus-ai_default"
      traefik.http.routers.governance.rule: "Host(`governance.duke-analytics.com`)"
      traefik.http.routers.governance.entrypoints: "websecure"
      traefik.http.routers.governance.tls.certresolver: "letsencrypt"
      traefik.http.services.governance.loadbalancer.server.port: "4180"
      # Redirect plain HTTP to HTTPS for this host only.
      traefik.http.routers.governance-web.rule: "Host(`governance.duke-analytics.com`)"
      traefik.http.routers.governance-web.entrypoints: "web"
    networks:
      - internal
      - tellus
    restart: unless-stopped

networks:
  internal:
    name: governance_internal
  tellus:
    external: true
    name: tellus-ai_default
