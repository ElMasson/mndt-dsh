# oauth2-proxy in front of the governance authority, Microsoft Entra ID.
# Values that are not secret live here; the two secrets are read from files so
# this configuration can stay in version control.

provider = "oidc"
oidc_issuer_url = "https://login.microsoftonline.com/5ed9c3e0-522a-46fa-978a-dd6bc245d710/v2.0"
client_id = "122bdf54-4ab8-4ef1-995e-a08501d04782"
# client_secret is passed with --client-secret-file: the "@file" form is not resolved here.

redirect_url = "https://governance.duke-analytics.com/oauth2/callback"
email_domains = ["datanalysis.re", "duke-analytics.com"]

# Without a cookie secret oauth2-proxy refuses to start.
# cookie_secret is passed with --cookie-secret-file.
cookie_secure = true
cookie_samesite = "lax"

# Traefik forwards here and oauth2-proxy proxies the authority itself, so one
# hop authenticates and forwards.
http_address = "0.0.0.0:4180"
upstreams = ["http://authority:8787/"]
reverse_proxy = true
pass_user_headers = true
skip_provider_button = true

# The authority reads the identity from the bearer token it already trusts; the
# signed-in email is what ties a person to a grant, so keep it in the headers.
set_xauthrequest = true
