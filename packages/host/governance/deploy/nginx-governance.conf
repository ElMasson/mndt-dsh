# nginx entry point for the governance authority.
#
# Install: /etc/nginx/conf.d/governance.conf
# Replace governance.duck-analytics.internal with the name that resolves to
# 51.159.164.138 and matches the TLS certificate.

server {
    listen 80;
    server_name governance.duck-analytics.internal;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name governance.duck-analytics.internal;

    ssl_certificate     /etc/ssl/governance/fullchain.pem;
    ssl_certificate_key /etc/ssl/governance/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Every request is authenticated by Entra through oauth2-proxy. The browser
    # never holds the authority token: the person holds a session cookie with the
    # proxy, and the authority token stays in each workstation's environment.
    location / {
        auth_request /oauth2/auth;
        error_page 401 = /oauth2/sign_in;

        auth_request_set $user $upstream_http_x_auth_request_email;
        proxy_set_header X-Auth-Request-Email $user;
        proxy_set_header Authorization $http_authorization;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass http://127.0.0.1:4180;
    }

    location /oauth2/ {
        proxy_pass http://127.0.0.1:4180;
        proxy_set_header Host $host;
    }
}
