# nginx entry point for the governance authority.
#
# Install: /etc/nginx/conf.d/governance.conf
# Replace governance.duke-analytics.com with the name that resolves to
# 51.159.164.138 and matches the TLS certificate.

server {
    listen 80;
    server_name governance.duke-analytics.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name governance.duke-analytics.com;

    ssl_certificate     /etc/ssl/governance/fullchain.pem;
    ssl_certificate_key /etc/ssl/governance/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Every request is authenticated by Entra through oauth2-proxy. The browser
    # never holds the authority token: the person holds a session cookie with the
    # proxy, and the authority token stays in each workstation's environment.
    # oauth2-proxy runs in reverse-proxy mode (its `upstreams` list points at
    # the authority), so it authenticates and forwards in one hop. Adding
    # auth_request here would authenticate twice for the same request.
    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:4180;
    }

    location /oauth2/ {
        proxy_pass http://127.0.0.1:4180;
        proxy_set_header Host $host;
    }
}
