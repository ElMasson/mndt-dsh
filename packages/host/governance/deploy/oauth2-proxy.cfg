# oauth2-proxy in front of the governance authority, Microsoft Entra ID.
#
# Install: /etc/oauth2-proxy/governance.cfg
# Secret values come from the environment, not from this file, so the file can
# live in version control with the repository.

provider = "oidc"
oidc_issuer_url = "https://login.microsoftonline.com/TENANT_ID/v2.0"
client_id = "CLIENT_ID"
client_secret = "CLIENT_SECRET"

redirect_url = "https://governance.duck-analytics.internal/oauth2/callback"
email_domains = ["duke-analytics.com"]

# Only the assigned Entra group reaches the authority.
allowed_groups = ["DSH-Governance"]

# Loopback only: nginx is the public entry point.
http_address = "127.0.0.1:4180"
upstreams = ["http://127.0.0.1:8787/"]

cookie_secure = true
cookie_httponly = true
cookie_samesite = "lax"
reverse_proxy = true

skip_provider_button = true
