name: mndt-front

# Single sign-on front for the workbench.
#
# The gateway is the only upstream of the proxy: it bootstraps the shell launch
# token for a browser cookie and routes /mndt-api to the product API, which reads
# the identity the proxy proved. Traefik publishes the host and terminates TLS.

services:
  gateway:
    image: node:22-bookworm-slim
    command: ["node", "/opt/gateway/server.mjs"]
    environment:
      PORT: "8080"
      WORKBENCH: "http://workbench:3111"
      API: "http://workbench:8795"
      TOKEN_FILE: "/state/web-token"
    volumes:
      - /opt/mndt-front/gateway:/opt/gateway:ro
      - /data/mndt/live:/state:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - front
    restart: unless-stopped

  proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5
    command:
      - "--config=/etc/mndt-front/oauth2.cfg"
      - "--client-secret-file=/etc/mndt-front/client_secret"
      - "--cookie-secret-file=/etc/mndt-front/cookie_secret"
      - "--trusted-proxy-ip=172.18.0.0/16"
    volumes:
      - /etc/mndt-front:/etc/mndt-front:ro
    labels:
      traefik.enable: "true"
      traefik.docker.network: "tellus-ai_default"
      traefik.http.routers.mndt.rule: "Host(`mndt.duke-analytics.com`)"
      traefik.http.routers.mndt.entrypoints: "websecure"
      traefik.http.routers.mndt.tls.certresolver: "letsencrypt"
      traefik.http.services.mndt.loadbalancer.server.port: "4180"
      traefik.http.routers.mndt-web.rule: "Host(`mndt.duke-analytics.com`)"
      traefik.http.routers.mndt-web.entrypoints: "web"
    networks:
      - front
      - tellus
    depends_on:
      - gateway
    restart: unless-stopped

  workbench:
    image: mndt-workbench:local
    # The gateway is the only ingress: this service publishes no port and is only
    # reachable on the front network.
    env_file:
      - /data/mndt/live/model.env
    environment:
      DSH_HOME: /state/home
      DSH_MNDT_IDENTITY: duke@datanalysis.re
      DSH_MNDT_LOCAL_OWNER: duke@datanalysis.re
      DSH_MNDT_STATE: /state/state.json
      DSH_MNDT_PORT: "8795"
      DSH_MNDT_TOKENS_FILE: /state/tokens.json
      DSH_MNDT_PROXY_USER_HEADER: x-forwarded-email
      DSH_MNDT_BRIEFING_AT: "06:30"
      DSH_PERMISSION_MODE: danger-full-access
      PUBLIC_URL: https://mndt.duke-analytics.com/
      TRUSTED_HOST: mndt.duke-analytics.com
    command: ["sh", "/opt/mndt-tools/workbench-entrypoint.sh"]
    # Loopback-only publications so the host can check the page and the API;
    # nothing on the public interface.
    ports:
      - "127.0.0.1:3111:3111"
      - "127.0.0.1:8795:8795"
    volumes:
      - /data/mndt/live:/state
      - /data/mndt/live/tools:/opt/mndt-tools:ro
      - /data/mndt/live/mcp-auth:/state/mcp-auth
    networks:
      - front
    restart: unless-stopped
networks:
  front: {}
  tellus:
    external: true
    name: tellus-ai_default
