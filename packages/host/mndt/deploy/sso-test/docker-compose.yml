services:
  stub:
    image: node:22-bookworm-slim
    command: ["node", "/app/sso-stub.mjs"]
    environment:
      PORT: "9000"
      ISSUER: "http://stub:9000"
      CLIENT_ID: "test-client"
      EMAIL: "duke@datanalysis.re"
    volumes:
      - /opt/mndt-ssotest/sso-stub.mjs:/app/sso-stub.mjs:ro
    networks:
      - sso

  proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5
    command:
      - "--config=/etc/mndt-ssotest/oauth2.cfg"
      - "--client-secret-file=/etc/mndt-ssotest/client_secret"
      - "--cookie-secret-file=/etc/mndt-ssotest/cookie_secret"
    volumes:
      - /etc/mndt-ssotest:/etc/mndt-ssotest:ro
    ports:
      - "127.0.0.1:8443:8443"
    depends_on:
      - stub
    networks:
      - sso
      - front
    restart: unless-stopped

networks:
  sso: {}
  front:
    external: true
    name: mndt-front_front
